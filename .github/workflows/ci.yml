name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Non-secret placeholders so the build can run; never real credentials.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder-publishable-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
      ADMIN_IMPORT_SECRET: placeholder-admin-secret
      GREENHOUSE_BOARD_TOKEN: placeholder
      GREENHOUSE_COMPANY_NAME: Placeholder
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
